name: inonu-cloud
services:
  edge:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    secrets: [gateway_token]
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - auth
      - app
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  auth:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/auth_session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/auth_storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/auth_jwt
      AUTHELIA_NOTIFIER_SMTP_ADDRESS: ${INONU_SMTP_ADDRESS:?configure_smtp}
      AUTHELIA_NOTIFIER_SMTP_USERNAME: ${INONU_SMTP_USERNAME:?configure_smtp_user}
      AUTHELIA_NOTIFIER_SMTP_SENDER: ${INONU_SMTP_SENDER:?configure_smtp_sender}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    volumes:
      - ./generated/authelia.yml:/config/configuration.yml:ro
      - auth-data:/var/lib/authelia
    secrets: [auth_session, auth_storage, auth_jwt, authelia_users, smtp_password]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    stop_grace_period: 5m
    environment:
      INONU_PUBLIC_ORIGIN: https://trader.${INONU_DOMAIN:?configure_domain}
      INONU_OWNER: ${INONU_OWNER:?configure_owner}
      HOME: /var/lib/inonu/home
    volumes:
      - app-data:/var/lib/inonu
    secrets: [model_key, okx_key, okx_secret, okx_passphrase, gateway_token]
    healthcheck:
      test: [CMD, bun, --no-env-file, run, src/server/cloud-health.ts]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  backend:
volumes:
  app-data:
  auth-data:
  caddy-data:
  caddy-config:
secrets:
  gateway_token: { file: ./secrets/gateway_token }
  model_key: { file: ./secrets/model_key }
  okx_key: { file: ./secrets/okx_key }
  okx_secret: { file: ./secrets/okx_secret }
  okx_passphrase: { file: ./secrets/okx_passphrase }
  auth_session: { file: ./secrets/auth_session }
  auth_storage: { file: ./secrets/auth_storage }
  auth_jwt: { file: ./secrets/auth_jwt }
  authelia_users: { file: ./secrets/authelia_users }
  smtp_password: { file: ./secrets/smtp_password }
