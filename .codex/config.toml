# Configuração do projeto para o Codex CLI. Ver AGENTS.md.
# Padrão conservador: aprovação sob pedido e escrita só no workspace.
# Não use approval_policy = "never" nem danger-full-access sem pedido explícito do dono.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

